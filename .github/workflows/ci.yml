name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # O package-lock.json é gerado pelo npm 11 (packageManager em package.json);
      # o npm 10 que vem com o Node 22 o considera fora de sincronia no `npm ci`.
      - name: Install npm 11
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Dívida antiga: o código veio da VPS 002 sem passar pelo lint (344 erros de
      # estilo em 26/nov/2026). Roda e aparece no log, mas não bloqueia até a limpeza.
      - name: Lint
        run: npm run lint
        continue-on-error: true
